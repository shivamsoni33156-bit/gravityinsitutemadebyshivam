{% extends "base.html" %}

{% block title %}Contact - Gravity Teaching{% endblock %}

{% block content %}
<section class="contact-page">
    <div class="section-header text-center">
        <h1 class="montserrat">Contact Us</h1>
    </div>
    <div class="contact-content">
        <div class="contact-info glass-card">
            <h2>Get In Touch</h2>
            <div class="contact-item">
                <h3>📞 Phone</h3>
                <p>+91 12345 67890</p>
            </div>
            <div class="contact-item">
                <h3>✉️ Email</h3>
                <p>info@gravityteaching.com</p>
            </div>
            <div class="contact-item">
                <h3>📍 Address</h3>
                <p>Gravity Teaching Institute<br>Your City, State 123456, India</p>
            </div>
            <!-- Google Maps embed -->
            <div class="maps">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d... " width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
        <div class="contact-form glass-card">
            <h2>Send Message</h2>
            <form method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
